<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Choose an environment</title>
  <link rel="icon" href="icons/icon-32.png">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="chooser.js"></script>
</head>
<body>
  <main class="da-env">
    <h1>Open on which environment?</h1>
    <p class="da-env-page"
      data-page="Preview of"
      data-live="Published page"></p>
    <ul class="da-env-list" aria-label="Environments" data-branch="branch"></ul>
    <p class="da-env-hint">Press 1, 2, 3… to choose. Content is the same on every environment; only the code (branch) differs.</p>
    <p class="da-env-error" role="alert" hidden>This page can't be opened: the link is not a DA preview or publish link.</p>
  </main>
</body>
</html>
